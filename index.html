<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{--ink:#211c2b;--muted:#817a8b;--purple:#7651b5;--purple2:#604092;--line:#ece8f1;--paper:#faf9fc;--white:#fff;--soft:#f1ebfa;--green:#267a59;--red:#b53b55}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.serif{font-family:'Playfair Display',serif}.topline{height:4px;background:linear-gradient(90deg,#4c3277,#a88bd4,#6d4b9c)}header{position:sticky;top:0;z-index:5;background:#faf9fcf2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:11px;align-items:center;text-decoration:none}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Playfair Display';font-size:22px}.brandname{font-weight:700;letter-spacing:.03em}.brandtag{font-size:10px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}.navright{display:flex;gap:10px;align-items:center}.tiny-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);font-weight:700}.hero{max-width:1180px;margin:auto;padding:55px 22px 29px;display:grid;grid-template-columns:1.3fr .7fr;align-items:end;gap:25px}.hero h1{font:600 clamp(36px,5vw,62px)/1.05 'Playfair Display',serif;letter-spacing:-.035em;margin:13px 0}.hero p{color:var(--muted);line-height:1.7;max-width:500px;margin:0}.hero-side{justify-self:end;background:#f0eafa;border:1px solid #e8ddf7;border-radius:20px;padding:20px 22px;max-width:290px;width:100%}.hero-side strong{font:600 23px 'Playfair Display';display:block;margin:7px 0}.hero-side span{color:#71657f;font-size:12px;line-height:1.5}.tools{max-width:1180px;margin:auto;padding:0 22px 20px;display:flex;gap:10px;align-items:center}.searchwrap{flex:1;position:relative}.searchwrap input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);background:white;border-radius:13px;outline:none}.searchwrap input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#b6a0d9;box-shadow:0 0 0 3px #7651b515}.searchicon{position:absolute;left:15px;top:12px;color:#94899f}.filter{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);max-width:170px}.sectionhead{max-width:1180px;padding:10px 22px 18px;margin:auto;display:flex;justify-content:space-between;align-items:center}.sectionhead h2{font:600 27px 'Playfair Display';margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.catalog{max-width:1180px;margin:auto;padding:0 22px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0;transition:transform .2s,border-color .2s}.product:hover{transform:translateY(-3px);border-color:#d7c9e8}.gallery{position:relative;aspect-ratio:1.23;background:#f0edf4;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover;display:block}.gallery-placeholder{height:100%;display:grid;place-items:center;color:#a69ab6;font:50px 'Playfair Display'}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#ffffffdf;width:32px;height:32px;border-radius:50%;font-size:19px;color:#332541;box-shadow:0 2px 10px #20102a16}.gallery-arrow.prev{left:10px}.gallery-arrow.next{right:10px}.dots{position:absolute;bottom:11px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dot{width:5px;height:5px;border-radius:50%;background:#fff9;border:1px solid #ffffffa8}.dot.active{background:white;width:17px;border-radius:8px}.product-body{padding:17px 18px 19px}.product-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.product h3{font:600 21px/1.2 'Playfair Display';margin:0 0 7px;overflow-wrap:anywhere}.category{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);font-weight:700}.price{font-size:13px;font-weight:700;white-space:nowrap;color:var(--purple2)}.desc{font-size:13px;line-height:1.6;color:var(--muted);margin:8px 0 16px;overflow-wrap:anywhere;white-space:pre-line}.product-actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:12px;transition:background .15s,transform .15s}.btn:active{transform:scale(.98)}.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{background:var(--purple2)}.btn-secondary{background:#f3eff8;color:var(--purple2)}.product-actions .btn-primary{flex:1;text-align:center;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:8px}.empty{grid-column:1/-1;text-align:center;padding:55px 15px;color:var(--muted);border:1px dashed #d9d0e4;border-radius:20px}.empty strong{display:block;font:25px 'Playfair Display';color:var(--ink);margin-bottom:8px}.footer{border-top:1px solid var(--line);padding:22px;text-align:center;font-size:11px;color:var(--muted)}.footer b{color:var(--purple2)}.hidden{display:none!important}
/* admin studio */.studio{min-height:100vh;background:#f7f5fa}.studio-nav{background:white;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.studio-wrap{max-width:1120px;margin:0 auto;padding:35px 22px 70px}.studio-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:25px}.studio-title h1{font:600 36px 'Playfair Display';margin:6px 0}.studio-title p{color:var(--muted);font-size:13px;margin:0}.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 8px 30px #2e1d4210}.panel h2{font:600 22px 'Playfair Display';margin:0 0 19px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:700;color:#51475e}.field input,.field textarea,.field select{width:100%;border:1px solid #e5dfec;background:#fff;border-radius:10px;padding:12px 13px;outline:none;color:var(--ink);min-width:0}.field textarea{resize:vertical;min-height:88px}.field small{color:var(--muted);font-size:11px;line-height:1.5}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:9px;margin-top:20px}.form-actions .btn{flex:1}.status{font-size:12px;line-height:1.5;border-radius:10px;padding:11px 13px;margin:12px 0;display:none}.status.show{display:block}.status.error{background:#fff0f2;color:#9b2942}.status.ok{background:#eaf7f0;color:#216d4c}.uploadbox{border:1px dashed #cfc1e0;border-radius:12px;padding:14px;background:#fbf9fe}.uploadbox input{border:0;padding:4px 0;background:transparent}.previewstrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.previewstrip img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.manage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.manage-head h2{margin:0}.manage-list{display:flex;flex-direction:column;gap:9px}.manage-item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:9px}.manage-item img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#f0edf4}.manage-copy{flex:1;min-width:0}.manage-copy strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.manage-copy span{font-size:11px;color:var(--muted)}.manage-actions{display:flex;gap:5px}.mini-btn{border:0;background:#f1edf7;color:#604092;border-radius:8px;padding:8px;font-size:11px;font-weight:700}.mini-btn.danger{background:#fff0f2;color:#a02d46}.login-shell{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top right,#e8ddf7 0,transparent 44%),#f9f7fc}.login-card{width:min(100%,420px);background:white;border:1px solid var(--line);border-radius:23px;padding:30px;box-shadow:0 25px 75px #34204515}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-card h1{font:600 34px 'Playfair Display';margin:0 0 7px}.login-card>p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 25px}.login-note{border-top:1px solid var(--line);margin-top:19px;padding-top:16px;font-size:11px;color:var(--muted);line-height:1.6}.login-note b{color:var(--purple2)}.back-link{background:none;border:0;color:var(--muted);font-size:12px;padding:10px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#241c30;color:#fff;padding:12px 17px;border-radius:12px;font-size:12px;z-index:20;transition:.2s;max-width:calc(100% - 30px)}.toast.show{opacity:1;transform:translate(-50%,0)}.loadline{height:3px;background:#eee7f7;overflow:hidden}.loadline:after{content:'';display:block;width:35%;height:100%;background:var(--purple);animation:load 1s infinite ease-in-out}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(310%)}}@media(max-width:680px){.nav{padding:13px 16px}.hero{padding:35px 16px 22px;grid-template-columns:1fr;gap:18px}.hero h1{font-size:43px}.hero-side{justify-self:stretch;max-width:none;padding:14px 17px}.hero-side strong{font-size:20px}.tools{padding:0 16px 18px;flex-wrap:wrap}.filter{flex:1;max-width:none}.sectionhead{padding:7px 16px 14px}.sectionhead h2{font-size:24px}.catalog{padding:0 12px 50px;gap:10px}.product{border-radius:14px}.gallery{aspect-ratio:.88}.product-body{padding:12px 11px 13px}.product h3{font-size:17px}.category{font-size:9px}.price{font-size:11px}.desc{font-size:11px;line-height:1.5;margin:7px 0 12px}.product-actions{gap:5px}.product-actions .btn{padding:10px 8px;font-size:10px}.gallery-arrow{width:28px;height:28px}.studio-wrap{padding:25px 14px 50px}.studio-grid{grid-template-columns:1fr}.studio-title{align-items:start;flex-direction:column}.studio-title h1{font-size:31px}.panel{padding:17px}.two-fields{grid-template-columns:1fr 1fr}.login-card{padding:24px}.brandtag{font-size:9px}}@media(max-width:350px){.catalog{grid-template-columns:1fr}.gallery{aspect-ratio:1.2}.product h3{font-size:20px}.desc{font-size:12px}}
</style>
</head>
<body><div class="topline"></div><div id="app"><div class="loadline"></div></div><div id="toast" class="toast"></div>
<script>
(() => {
  const SUPABASE_URL = 'GANTI_DENGAN_SUPABASE_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'GANTI_DENGAN_SUPABASE_ANON_KEY';
  const ADMIN_EMAIL = 'adamradit01@gmail.com';
  const ADMIN_PATH = '/atelier-console';
  const hasConfig = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('GANTI_DENGAN') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('GANTI_DENGAN');
  const client = hasConfig ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
  const app = document.getElementById('app');
  let products = [], session = null, editingId = null, chosenFiles = [], carouselIndexes = {}, query = '', category = 'all';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = v => { if(v===null || v===undefined || v==='') return ''; const n=Number(v); return Number.isFinite(n) ? new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n) : String(v); };
  const path = () => location.pathname.replace(/\/$/,'') || '/';
  const isAdminPath = () => path() === ADMIN_PATH || path() === ADMIN_PATH + '/';
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2800)}
  function status(id,msg,type='ok'){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className='status show '+type}
  function urlOk(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)}catch{return false}}
  function imgFallback(){return '<div class="gallery-placeholder">M</div>'}
  function renderMarket(){
    const visible=products.filter(p=>(p.name+' '+(p.description||'')+' '+(p.category||'')).toLowerCase().includes(query.toLowerCase()) && (category==='all'||p.category===category));
    const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];
    app.innerHTML=`<header><nav class="nav"><a href="/" class="brand"><span class="brandmark">M</span><span><span class="brandname">MAISON MARKET</span><span class="brandtag" style="display:block">A CURATED COLLECTION</span></span></a><div class="navright"><span class="tiny-label" style="display:none" id="securetag">Curated for you</span></div></nav></header>
    <section class="hero"><div><div class="tiny-label">Less scrolling, better finds</div><h1 class="serif">Temukan yang<br>berarti.</h1><p>Koleksi pilihan, dirangkum dalam satu tempat. Jelajahi detailnya lalu lanjutkan ke tautan produk resmi.</p></div><aside class="hero-side"><div class="tiny-label">The edit / 01</div><strong>Pilihan, bukan kebisingan.</strong><span>Temukan produk menarik lewat katalog yang dikurasi dengan cermat.</span></aside></section>
    <div class="tools"><div class="searchwrap"><span class="searchicon">⌕</span><input id="search" placeholder="Cari nama atau kategori produk…" value="${esc(query)}" aria-label="Cari produk"></div><select class="filter" id="category" aria-label="Filter kategori"><option value="all">Semua kategori</option>${cats.map(c=>`<option value="${esc(c)}" ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="sectionhead"><h2 class="serif">The collection</h2><span>${visible.length} ${visible.length===1?'produk':'produk'} pilihan</span></div>
    <main class="catalog">${visible.length?visible.map(p=>productCard(p)).join(''):`<div class="empty"><strong>${products.length?'Belum ada yang cocok.':'Koleksi sedang disiapkan.'}</strong>${products.length?'Coba kata pencarian atau kategori lain.':'Produk pilihan akan muncul di sini setelah admin menerbitkannya.'}</div>`}</main>
    <footer class="footer">Dikurasi dengan <b>perhatian.</b> · Maison Market</footer>`;
    document.getElementById('search').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;renderMarket();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)});
    document.getElementById('category').addEventListener('change',e=>{category=e.target.value;renderMarket()});
    document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id, p=products.find(x=>x.id===id);if(!p)return;const len=(p.images||[]).length;carouselIndexes[id]=((carouselIndexes[id]||0)+(b.dataset.slide==='next'?1:-1)+len)%len;renderMarket()}));
  }
  function productCard(p){
    const imgs=Array.isArray(p.images)?p.images.filter(Boolean):[], i=(carouselIndexes[p.id]||0)%Math.max(1,imgs.length);
    return `<article class="product"><div class="gallery">${imgs.length?`<img loading="lazy" src="${esc(imgs[i])}" alt="${esc(p.name)} — foto ${i+1}" onerror="this.style.display='none'">${imgs.length>1?`<button class="gallery-arrow prev" data-slide="prev" data-id="${esc(p.id)}" aria-label="Foto sebelumnya">‹</button><button class="gallery-arrow next" data-slide="next" data-id="${esc(p.id)}" aria-label="Foto berikutnya">›</button><div class="dots">${imgs.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('')}</div>`:''}` : imgFallback()}</div><div class="product-body"><div class="product-top"><div style="min-width:0"><div class="category">${esc(p.category||'Pilihan editor')}</div><h3>${esc(p.name)}</h3></div>${p.price!==null&&p.price!==undefined&&p.price!==''?`<span class="price">${esc(money(p.price))}</span>`:''}</div>${p.description?`<p class="desc">${esc(p.description)}</p>`:''}<div class="product-actions"><a class="btn btn-primary" href="${urlOk(p.destination_url)?esc(p.destination_url):'#'}" target="_blank" rel="noopener noreferrer" ${urlOk(p.destination_url)?'':'aria-disabled="true"'}>Lihat produk <span>↗</span></a></div></div></article>`;
  }
  function renderConfigError(){app.innerHTML=`<main class="login-shell"><section class="login-card"><div class="login-brand"><span class="brandmark">M</span><span><b>MAISON MARKET</b><span class="brandtag" style="display:block">SETUP REQUIRED</span></span></div><h1>Hubungkan katalog.</h1><p>Website sudah disiapkan, tapi koneksi Supabase belum diisi.</p><div class="status show error">Buka <b>index.html</b> di GitHub lalu ganti SUPABASE_URL dan SUPABASE_ANON_KEY dengan Project URL dan publishable/anon key dari Supabase.</div><div class="login-note">Setelah itu jalankan SQL pada <b>supabase-setup.sql</b> dan deploy ulang.</div></section></main>`}
  function renderLogin(error=''){
    app.innerHTML=`<main class="login-shell"><section class="login-card"><div class="login-brand"><span class="brandmark">M</span><span><b>MAISON MARKET</b><span class="brandtag" style="display:block">PRIVATE STUDIO</span></span></div><div class="tiny-label">Admin access</div><h1>Selamat datang.</h1><p>Masuk ke studio privat untuk mengatur katalog dan menerbitkan produk pilihan.</p><form id="login-form"><div class="field"><label for="email">EMAIL ADMIN</label><input id="email" type="email" value="${ADMIN_EMAIL}" autocomplete="username" required readonly></div><div class="field"><label for="password">PASSWORD</label><input id="password" type="password" placeholder="Masukkan password admin" autocomplete="current-password" required></div><div id="login-status" class="status ${error?'show error':''}">${esc(error)}</div><button class="btn btn-primary" id="login-submit" style="width:100%;padding:14px">Masuk ke studio <span>↗</span></button></form><div class="login-note">Akses privat · Email admin sudah dikunci ke <b>${ADMIN_EMAIL}</b>.<br>Akun dan password dibuat sendiri melalui Supabase Auth.</div><button class="back-link" id="back-market">← Kembali ke market</button></section></main>`;
    document.getElementById('back-market').onclick=()=>{history.pushState({},'', '/');render()};
    document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('login-submit');btn.disabled=true;btn.textContent='Memeriksa akses…';const pass=document.getElementById('password').value;
      const {data,error}=await client.auth.signInWithPassword({email:ADMIN_EMAIL,password:pass});
      if(error){status('login-status',error.message==='Invalid login credentials'?'Email atau password tidak cocok.':error.message,'error');btn.disabled=false;btn.innerHTML='Masuk ke studio ↗';return}
      if((data.user?.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await client.auth.signOut();status('login-status','Akun ini tidak memiliki akses admin.','error');btn.disabled=false;btn.innerHTML='Masuk ke studio ↗';return}
      session=data.session;await renderStudio();
    };
  }
  function studioShell(content){
    app.innerHTML=`<div class="studio"><header class="studio-nav"><a href="/" class="brand" style="text-decoration:none"><span class="brandmark">M</span><span><span class="brandname">MAISON STUDIO</span><span class="brandtag" style="display:block">PRIVATE ADMIN</span></span></a><div class="navright"><span class="tiny-label">${esc(ADMIN_EMAIL)}</span><button id="logout" class="btn btn-secondary">Keluar</button></div></header>${content}</div>`;
    document.getElementById('logout').onclick=async()=>{await client.auth.signOut();session=null;history.pushState({},'',ADMIN_PATH);renderLogin()};
  }
  async function renderStudio(){
    if(!session){renderLogin();return}
    if((session.user?.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await client.auth.signOut();renderLogin('Akun ini tidak memiliki akses admin.');return}
    editingId=null;chosenFiles=[];
    studioShell(`<main class="studio-wrap"><div class="studio-title"><div><div class="tiny-label">Your storefront, in your hands</div><h1>Product studio</h1><p>Kelola foto, detail, dan tautan produk dari satu tempat.</p></div><button id="view-market" class="btn btn-secondary">Lihat market ↗</button></div><div class="studio-grid"><section class="panel"><h2 id="form-heading">Tambah produk</h2><form id="product-form"><div class="field"><label for="p-name">NAMA PRODUK *</label><input id="p-name" maxlength="120" placeholder="Contoh: Everyday Tote" required></div><div class="two-fields"><div class="field"><label for="p-category">KATEGORI</label><input id="p-category" maxlength="50" placeholder="Aksesori"></div><div class="field"><label for="p-price">HARGA (OPSIONAL)</label><input id="p-price" type="number" min="0" step="1" placeholder="125000"></div></div><div class="field"><label for="p-desc">DESKRIPSI</label><textarea id="p-desc" maxlength="1800" placeholder="Jelaskan keunggulan atau detail produk…"></textarea></div><div class="field"><label for="p-url">TAUTAN PRODUK *</label><input id="p-url" type="url" placeholder="https://…" required><small>Link tujuan saat pengunjung menekan “Lihat produk”.</small></div><div class="field"><label for="p-images">FOTO PRODUK (BISA PILIH BANYAK)</label><div class="uploadbox"><input id="p-images" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple><small>JPG, PNG, WebP atau AVIF. Maksimum 6 foto per produk, 5 MB per foto.</small><div id="previewstrip" class="previewstrip"></div></div></div><div class="field"><label for="p-published">STATUS</label><select id="p-published"><option value="true">Terbitkan di market</option><option value="false">Simpan sebagai draft</option></select></div><div id="form-status" class="status"></div><div class="form-actions"><button class="btn btn-primary" id="save-product" type="submit">Simpan produk</button><button class="btn btn-secondary hidden" id="cancel-edit" type="button">Batal edit</button></div></form></section><section class="panel"><div class="manage-head"><h2>Katalog produk</h2><button id="refresh-products" class="mini-btn">↻ Refresh</button></div><div id="manage-list" class="manage-list"><div class="empty">Memuat produk…</div></div></section></div></main>`);
    document.getElementById('view-market').onclick=()=>{history.pushState({},'','/');render()};
    document.getElementById('p-images').onchange=previewFiles;
    document.getElementById('cancel-edit').onclick=resetForm;
    document.getElementById('refresh-products').onclick=loadAdminProducts;
    document.getElementById('product-form').onsubmit=saveProduct;
    await loadAdminProducts();
  }
  function previewFiles(e){chosenFiles=[...e.target.files].slice(0,6);const box=document.getElementById('previewstrip');box.innerHTML='';chosenFiles.forEach(f=>{const img=document.createElement('img');img.alt=f.name;img.src=URL.createObjectURL(f);box.appendChild(img)});if(e.target.files.length>6)toast('Maksimum 6 foto per produk.');}
  async function loadAdminProducts(){
    const list=document.getElementById('manage-list');if(!list)return;list.innerHTML='<div class="loadline"></div>';
    const {data,error}=await client.from('products').select('*').order('created_at',{ascending:false});
    if(error){list.innerHTML='<div class="empty">Gagal memuat katalog.</div>';toast('Gagal memuat produk: '+error.message);return}
    products=data||[];
    list.innerHTML=products.length?products.map(p=>`<div class="manage-item"><img src="${esc((p.images||[])[0]||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="manage-copy"><strong>${esc(p.name)}</strong><span>${p.is_published?'Terbit':'Draft'} · ${(p.images||[]).length} foto</span></div><div class="manage-actions"><button class="mini-btn" data-edit="${esc(p.id)}">Edit</button><button class="mini-btn danger" data-delete="${esc(p.id)}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada produk. Tambahkan produk pertamamu.</div>';
    list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
    list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));
  }
  function editProduct(id){
    const p=products.find(x=>x.id===id);if(!p)return;editingId=id;chosenFiles=[];
    document.getElementById('form-heading').textContent='Edit produk';
    document.getElementById('p-name').value=p.name||'';document.getElementById('p-category').value=p.category||'';document.getElementById('p-price').value=p.price??'';document.getElementById('p-desc').value=p.description||'';document.getElementById('p-url').value=p.destination_url||'';document.getElementById('p-published').value=String(!!p.is_published);
    document.getElementById('p-images').value='';document.getElementById('previewstrip').innerHTML=(p.images||[]).map(u=>`<img src="${esc(u)}" alt="Foto tersimpan">`).join('');
    document.getElementById('cancel-edit').classList.remove('hidden');document.getElementById('save-product').textContent='Simpan perubahan';document.getElementById('form-heading').scrollIntoView({behavior:'smooth',block:'center'});
  }
  function resetForm(){editingId=null;chosenFiles=[];document.getElementById('product-form').reset();document.getElementById('previewstrip').innerHTML='';document.getElementById('form-heading').textContent='Tambah produk';document.getElementById('cancel-edit').classList.add('hidden');document.getElementById('save-product').textContent='Simpan produk';const s=document.getElementById('form-status');s.className='status';}
  async function saveProduct(e){
    e.preventDefault();const btn=document.getElementById('save-product'),name=document.getElementById('p-name').value.trim(),destination=document.getElementById('p-url').value.trim();
    if(!urlOk(destination)){status('form-status','Tautan harus berupa URL http:// atau https:// yang valid.','error');return}
    const existing=products.find(p=>p.id===editingId),files=chosenFiles.slice(0,6);
    if(!existing&&!files.length){status('form-status','Tambahkan minimal satu foto produk.','error');return}
    if(files.some(f=>f.size>5*1024*1024)){status('form-status','Setiap foto harus berukuran maksimal 5 MB.','error');return}
    btn.disabled=true;btn.textContent='Menyimpan…';let uploaded=[];
    try{
      if(files.length){
        for(let i=0;i<files.length;i++){
          const file=files[i],safe=file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'),key=`${crypto.randomUUID()}-${safe}`;
          const {data,error}=await client.storage.from('product-images').upload(key,file,{cacheControl:'3600',upsert:false,contentType:file.type});
          if(error)throw error;
          const {data:pub}=client.storage.from('product-images').getPublicUrl(data.path);uploaded.push(pub.publicUrl);
        }
      }
      const images=files.length?(editingId?[...(existing?.images||[]),...uploaded]:uploaded):(existing?.images||[]);
      const row={name,category:document.getElementById('p-category').value.trim()||null,price:document.getElementById('p-price').value===''?null:Number(document.getElementById('p-price').value),description:document.getElementById('p-desc').value.trim()||null,destination_url:destination,images,is_published:document.getElementById('p-published').value==='true',updated_at:new Date().toISOString()};
      let result;
      if(editingId)result=await client.from('products').update(row).eq('id',editingId);
      else result=await client.from('products').insert(row);
      if(result.error)throw result.error;
      status('form-status',editingId?'Perubahan produk tersimpan.':'Produk berhasil ditambahkan.','ok');toast('Produk berhasil disimpan.');resetForm();await loadAdminProducts();
    }catch(err){status('form-status','Gagal menyimpan: '+(err.message||'Periksa koneksi dan aturan Supabase.'),'error');}
    finally{btn.disabled=false;btn.textContent=editingId?'Simpan perubahan':'Simpan produk';}
  }
  async function deleteProduct(id){
    const p=products.find(x=>x.id===id);if(!p||!confirm('Hapus produk “'+p.name+'”? Tindakan ini tidak bisa dibatalkan.'))return;
    const {error}=await client.from('products').delete().eq('id',id);if(error){toast('Gagal menghapus: '+error.message);return}
    // Images are left in storage intentionally, so other products never lose shared images.
    toast('Produk dihapus.');await loadAdminProducts();
  }
  async function render(){
    if(!client){renderConfigError();return}
    const admin=isAdminPath();
    const {data}=await client.auth.getSession();session=data?.session||null;
    if(admin){if(session&&(session.user?.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase())await renderStudio();else renderLogin();return}
    const {data:rows,error}=await client.from('products').select('id,name,description,category,price,images,destination_url').eq('is_published',true).order('created_at',{ascending:false});
    if(error){app.innerHTML='<header><nav class="nav"><span class="brandname">MAISON MARKET</span></nav></header><div class="empty" style="margin:50px auto;max-width:600px">Katalog belum bisa dimuat. Pastikan tabel dan policy Supabase sudah dibuat melalui supabase-setup.sql.</div>';return}
    products=rows||[];renderMarket();
  }
  window.addEventListener('popstate',render);
  window.addEventListener('hashchange',render);
  render();
})();
</script></body></html>
